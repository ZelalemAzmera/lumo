events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    server {
        listen 80;
        server_name localhost;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Root static files directory
        root /usr/share/nginx/html;
        index samples/test-harness.html index.html;

        # Serve Lumo Web Component SDK with permissive CORS for external embedding
        location /dist/ {
            alias /usr/share/nginx/html/packages/embed-sdk/dist/;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Serve Samples and Demo Platform Integrations
        location /samples/ {
            alias /usr/share/nginx/html/samples/;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "no-cache";
        }

        # Proxy API Requests to FastAPI Backend
        location /api/ {
            proxy_pass http://api:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Proxy OpenAPI Interactive Documentation
        location /docs {
            proxy_pass http://api:8000/docs;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://api:8000/openapi.json;
            proxy_set_header Host $host;
        }
    }
}
