<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumo — Proof Outside Savanna (demo/blank.html)</title>
  <!-- 1. Load the module -->
  <script src="../module/db-player.js" defer></script>
  <style>
    /* Midnight & Jade theme: Minimal host page with zero external framework */
    :root {
      --primary: #172B3A;
      --secondary: #E8EFF2;
      --accent: #20A486;
      --neutral: #FAFAF7;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--neutral);
      color: var(--primary);
      margin: 0;
      padding: 48px 24px;
      line-height: 1.6;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
    }
    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      color: var(--primary);
    }
    p.note {
      color: #485b6a;
      margin-bottom: 28px;
      font-size: 1rem;
    }
    .event-logger {
      margin-top: 24px;
      padding: 16px;
      background: var(--primary);
      border: 1px solid rgba(232, 239, 242, 0.2);
      border-radius: 6px;
      font-family: ui-monospace, 'JetBrains Mono', Consolas, monospace;
      font-size: 0.85rem;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Proof Outside Savanna — Blank Page Test</h1>
    <p class="note">
      This page carries zero host stylesheets. The player mounts via a single script tag and tag placement.
      It proves Shadow DOM encapsulation and full standalone operability for hackathon judges.
    </p>

    <!-- 2. Place it -->
    <db-player
      src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
      captions="../samples/captions-en.vtt,../samples/captions-am.vtt"
      sign="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4"
      describe="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4"
      lang="am">
    </db-player>

    <!-- 3. Optionally, listen to host events -->
    <div class="event-logger" id="event-log">
      Host Event Listener: Waiting for db-player events...
    </div>
  </div>

  <script>
    const logger = document.getElementById('event-log');
    document.addEventListener('db-player:progress', (e) => {
      logger.textContent = `Event [db-player:progress]: ${e.detail.seconds.toFixed(1)}s (${e.detail.percent}%)`;
    });
    document.addEventListener('db-player:prefs', (e) => {
      logger.textContent = `Event [db-player:prefs]: Size=${e.detail.captionSize}, Position=${e.detail.signPosition}`;
    });
    document.addEventListener('db-player:complete', () => {
      logger.textContent = `Event [db-player:complete]: Lesson completed!`;
    });
  </script>
</body>
</html>
